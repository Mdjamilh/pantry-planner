# Dependencies live in requirements.txt (runtime) and requirements-dev.txt.
# This file only holds tool configuration.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["pantry_planner/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["pantry_planner"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pantry_planner.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["e2e: browser tests that start a real server"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: Lint, types and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Dependency audit (runtime)
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o runtime-requirements.txt
          uv run pip-audit -r runtime-requirements.txt --strict

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: pantry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Unit and API tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://pantry:pantry@localhost:5432/pantry_test' || '' }}
        run: uv run pytest -m "not e2e" --cov=pantry_planner --cov-report=term-missing:skip-covered
      - name: Migrations apply cleanly
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql://pantry:pantry@localhost:5432/pantry_test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Playwright e2e
        run: uv run pytest -m e2e --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t pantry-planner:ci .
      - name: Smoke test
        run: |
          docker run -d --name pp -p 8000:8000 -e SECRET_KEY=ci -e DEMO_MODE=true pantry-planner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs pp
          exit 1
